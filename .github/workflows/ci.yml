name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadex
          POSTGRES_PASSWORD: leadex
          POSTGRES_DB: leadex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: local
      JWT_SECRET: ci-only-secret-not-for-production-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://leadex_app:leadex_app@localhost:5432/leadex_test
          TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://leadex:leadex@localhost:5432/leadex_test
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker:
    name: Docker images + prod compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: leadex/api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          tags: leadex/web:ci
          build-args: NEXT_PUBLIC_API_URL=https://app.example.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Validate production compose (dummy secrets)
        env:
          DOMAIN: ci.example.com
          JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789
          ENCRYPTION_KEY: ci-dummy
          POSTGRES_USER: leadex
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: leadex
          APP_DB_PASSWORD: ci-app
          REDIS_PASSWORD: ci
          QDRANT_API_KEY: ci
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci
          SEAWEEDFS_S3_CONFIG: ./infrastructure/docker/seaweedfs/s3.json
          GRAFANA_ADMIN_PASSWORD: ci
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile monitoring config --quiet
      - name: Shell script syntax
        run: for f in infrastructure/scripts/*.sh; do bash -n "$f"; done
