# Local development override: exposes data stores on 127.0.0.1 only so host tools (pytest, alembic, IDE) can reach them.
services:
  postgres:
    ports: ["127.0.0.1:5433:5432"]
  redis:
    ports: ["127.0.0.1:6379:6379"]
  qdrant:
    ports: ["127.0.0.1:6334:6333"]
  objectstore:
    ports: ["127.0.0.1:8333:8333"]
  api:
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes: ["./apps/api/app:/app/app", "./apps/api/alembic:/app/alembic"]
  worker:
    volumes: ["./apps/api/app:/app/app"]
  beat:
    volumes: ["./apps/api/app:/app/app"]
