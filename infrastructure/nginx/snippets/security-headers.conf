# Included in every TLS location that sets its own add_header (nginx does not inherit add_header across levels).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP: Next.js needs 'unsafe-inline' for its inline bootstrap scripts/styles unless nonces are wired up.
# Tighten (nonces, drop 'unsafe-inline') once the web app supports it. wss: allows websocket/voice connections.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
