# Production nginx main config (docker-compose.prod.yml). Server blocks are rendered from
# templates/leadex.conf.template (envsubst of ${DOMAIN}) into /etc/nginx/conf.d/ by the stock entrypoint.
# The legacy nginx.conf in this directory is the plain-HTTP config for local experiments.
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 25m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml application/manifest+json;

    # Rate limits (per client IP).
    limit_req_zone  $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=api:10m     rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=general:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream leadex_api { server api:8000; keepalive 16; }
    upstream leadex_web { server web:3000; keepalive 16; }

    # Docker embedded DNS, used for optional upstreams (grafana) so nginx starts even if they are not running.
    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
