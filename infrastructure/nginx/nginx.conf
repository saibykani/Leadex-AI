# Reverse proxy for the LEADEX stack. Upstream names match docker-compose service names.
worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    client_max_body_size 10m;

    # Brute-force protection for login/registration endpoints.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    upstream leadex_api { server api:8000; }
    upstream leadex_web { server web:3000; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Enable once TLS is terminated here or upstream:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/v1/auth {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://leadex_api;
        }

        location /api {
            proxy_pass http://leadex_api;
        }

        location /health {
            proxy_pass http://leadex_api;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://leadex_web;
        }
    }
}
