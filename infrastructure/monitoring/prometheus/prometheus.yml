# Prometheus scrape config for docker-compose.prod.yml (--profile monitoring). Targets are compose service names.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]

  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]

  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]

  # The API does not expose /metrics yet. Once it does (e.g. prometheus-fastapi-instrumentator), uncomment:
  # - job_name: api
  #   metrics_path: /metrics
  #   static_configs: [{ targets: ["api:8000"] }]
