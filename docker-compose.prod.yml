# Production override. Use INSTEAD of docker-compose.dev.yml:
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d
# Optional monitoring stack:  add  --profile monitoring
#
# - Only nginx publishes ports (80/443). Every other service is reachable only on the internal network.
# - All secrets are mandatory (${VAR:?}); compose refuses to start if one is missing.
# - Requires Docker Compose >= 2.24 (uses the !reset tag to drop ports declared in the base file).
#
# NOTE: Celery `worker` / `beat` services are defined in docker-compose.yml by another change. When they exist,
# give them the same treatment as `api` below (<<: *prod-defaults, environment from x-prod-api-env, limits).

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-prod-defaults: &prod-defaults
  restart: unless-stopped
  logging: *logging

x-prod-api-env: &prod-api-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://leadex_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}
  MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required (Fernet key)}
  CORS_ORIGINS: https://${DOMAIN:?DOMAIN required}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379/0
  QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY required}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY required}

services:
  postgres:
    <<: *prod-defaults
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    volumes: [pgdata:/var/lib/postgresql/data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }

  redis:
    <<: *prod-defaults
    ports: !reset []
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  qdrant:
    <<: *prod-defaults
    ports: !reset []
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY required}
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      # qdrant image ships without curl/wget; bash /dev/tcp probe of the HTTP port.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  objectstore:
    <<: *prod-defaults
    ports: !reset []
    # Production S3 credentials: a host file OUTSIDE the repo (same format as infrastructure/docker/seaweedfs/s3.json).
    volumes:
      - objectdata:/data
      - ${SEAWEEDFS_S3_CONFIG:?SEAWEEDFS_S3_CONFIG required (path to production s3.json)}:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  api:
    <<: *prod-defaults
    image: ${IMAGE_PREFIX:-leadex}/api:${IMAGE_TAG:-latest}
    ports: !reset []
    environment: *prod-api-env
    # No --reload, no source mounts. Migrations run as the schema owner before the server starts.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2} --proxy-headers --forwarded-allow-ips='*'"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }

  # Celery services (defined in docker-compose.yml). Same image/env as api; environment maps merge with the base.
  worker:
    <<: *prod-defaults
    image: ${IMAGE_PREFIX:-leadex}/api:${IMAGE_TAG:-latest}
    environment: *prod-api-env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }

  beat:
    <<: *prod-defaults
    image: ${IMAGE_PREFIX:-leadex}/api:${IMAGE_TAG:-latest}
    environment: *prod-api-env
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }

  web:
    <<: *prod-defaults
    image: ${IMAGE_PREFIX:-leadex}/web:${IMAGE_TAG:-latest}
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?DOMAIN required}
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  nginx:
    <<: *prod-defaults
    image: nginx:1.27-alpine
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN required}
    volumes:
      - ./infrastructure/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/snippets:/etc/nginx/snippets:ro
      - ./infrastructure/nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # Run the stock entrypoint (renders templates/*.template with $DOMAIN) and reload every 6h to pick up renewed certs.
    entrypoint: ["/bin/sh", "-c"]
    command: ["(while :; do sleep 6h; nginx -s reload; done) & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  certbot:
    <<: *prod-defaults
    image: certbot/certbot:v2.11.0
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renewal loop; first issuance is done by infrastructure/scripts/init-letsencrypt.sh.
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128m }

  backup:
    <<: *prod-defaults
    image: postgres:16-alpine
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB required}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-leadex}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
      TZ: ${TZ:-UTC}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./infrastructure/scripts/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - ./infrastructure/scripts/backup-cron-entrypoint.sh:/usr/local/bin/backup-cron-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-cron-entrypoint.sh"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  # ---------------- Monitoring (opt-in: --profile monitoring) ----------------
  prometheus:
    <<: *prod-defaults
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 1g }

  grafana:
    <<: *prod-defaults
    image: grafana/grafana:11.2.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN:?DOMAIN required}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  node-exporter:
    <<: *prod-defaults
    image: prom/node-exporter:v1.8.2
    profiles: ["monitoring"]
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128m }

  postgres-exporter:
    <<: *prod-defaults
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}?sslmode=disable
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128m }

  redis-exporter:
    <<: *prod-defaults
    image: oliver006/redis_exporter:v1.62.0
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128m }

volumes:
  letsencrypt:
  certbot-www:
  promdata:
  grafanadata:
