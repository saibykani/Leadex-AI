# Base stack. Data stores are NOT published to the host here; docker-compose.dev.yml binds them to 127.0.0.1 only.
name: leadex

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-local}
  # Runtime uses the restricted leadex_app role (row-level security enforced); migrations use the owner.
  DATABASE_URL: postgresql+psycopg://leadex_app:${APP_DB_PASSWORD:-leadex_app}@postgres:5432/${POSTGRES_DB:-leadex}
  MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leadex}:${POSTGRES_PASSWORD:-leadex}@postgres:5432/${POSTGRES_DB:-leadex}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-leadex_app}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  QDRANT_URL: http://qdrant:6333
  S3_ENDPOINT: http://objectstore:8333
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-}
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-}
  AI_HTTP_TIMEOUT_S: ${AI_HTTP_TIMEOUT_S:-30}
  FAST_LLM_BASE_URL: ${FAST_LLM_BASE_URL:-}
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-}
  DISCOVERY_DAILY_REQUEST_BUDGET: ${DISCOVERY_DAILY_REQUEST_BUDGET:-}
  GOOGLE_PLACES_RETENTION_DAYS: ${GOOGLE_PLACES_RETENTION_DAYS:-}
  GOOGLE_PLACES_UNIT_COST: ${GOOGLE_PLACES_UNIT_COST:-}
  DISCOVERY_HTTP_TIMEOUT: ${DISCOVERY_HTTP_TIMEOUT:-}
  WEBSITE_AUDIT_MAX_RETRIES: ${WEBSITE_AUDIT_MAX_RETRIES:-}
  VOICE_KILL_SWITCH: ${VOICE_KILL_SWITCH:-}
  CLAMAV_PORT: ${CLAMAV_PORT:-}
  TWILIO_VOICE_DEFAULT: ${TWILIO_VOICE_DEFAULT:-}
  AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  CLAMAV_REQUIRED: ${CLAMAV_REQUIRED:-}
  DNC_ENFORCE: ${DNC_ENFORCE:-}
  DNC_API_URL: ${DNC_API_URL:-}
  DNC_API_KEY: ${DNC_API_KEY:-}
  DNC_MAX_AGE_DAYS: ${DNC_MAX_AGE_DAYS:-31}
  FAST_LLM_API_KEY: ${FAST_LLM_API_KEY:-}
  FAST_LLM_MODEL: ${FAST_LLM_MODEL:-}
  TWILIO_VOICE_EN_IN: ${TWILIO_VOICE_EN_IN:-}
  TWILIO_VOICE_HI_IN: ${TWILIO_VOICE_HI_IN:-}
  CELERY_ENABLED: ${CELERY_ENABLED:-true}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-}
  WEB_APP_URL: ${WEB_APP_URL:-}
  # Integration credentials (empty => adapter reports not_configured)
  GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  MS_CLIENT_ID: ${MS_CLIENT_ID:-}
  MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
  MS_TENANT_ID: ${MS_TENANT_ID:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
  WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN:-}
  WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-}
  WA_APP_SECRET: ${WA_APP_SECRET:-}
  WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
  TWILIO_ESCALATION_NUMBER: ${TWILIO_ESCALATION_NUMBER:-}
  TWILIO_MACHINE_DETECTION: ${TWILIO_MACHINE_DETECTION:-false}
  PUBLIC_WEBHOOK_BASE_URL: ${PUBLIC_WEBHOOK_BASE_URL:-}
  ALLOW_TEST_CALLS: ${ALLOW_TEST_CALLS:-false}
  TEST_CALL_ALLOWLIST: ${TEST_CALL_ALLOWLIST:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadex}
      POSTGRES_DB: ${POSTGRES_DB:-leadex}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadex}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes: [qdrantdata:/qdrant/storage]

  objectstore:
    # S3-compatible storage (SeaweedFS). Local credentials live in infrastructure/docker/seaweedfs/s3.json;
    # staging/production must mount their own config from a secrets manager.
    image: chrislusf/seaweedfs:3.80
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes: ["objectdata:/data", "./infrastructure/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro"]

  api:
    build: { context: ./apps/api }
    environment: *api-env
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2} --proxy-headers"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      retries: 10
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]

  worker:
    build: { context: ./apps/api }
    environment:
      <<: *api-env
      CELERY_ENABLED: ${CELERY_ENABLED:-true}
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info", "--concurrency", "${WORKER_CONCURRENCY:-2}"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }  # api runs the migrations

  beat:
    build: { context: ./apps/api }
    environment:
      <<: *api-env
      CELERY_ENABLED: ${CELERY_ENABLED:-true}
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]

  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["ai"]
    volumes: [ollamadata:/root/.ollama]

  # Free virus scanning for uploads (needs ~1.5 GB RAM; first start downloads signatures, ~5 min).
  # Start with: docker compose --profile scan up -d   and set CLAMAV_HOST=clamav in .env
  clamav:
    image: clamav/clamav:1.4.1
    profiles: ["scan"]
    volumes: [clamdata:/var/lib/clamav]

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  objectdata:
  ollamadata:
  clamdata:
